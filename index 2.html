function bfs(src){const d={[src]:0},q=[src];while(q.length){const n=q.shift();ADJ[n].forEach(m=>{if(d[m]==null){d[m]=d[n]+1;q.push(m)}})}return d}
const DIST={door:bfs(7),vent:bfs(4)},TGT={door:7,vent:4};

function bossStep(e){
  const D=DIST[e.t];if(e.node===TGT[e.t]){e.st='at';e.at=0;return}

  $('.feet').classList.toggle('on',!!G.hide&&G.en.some(e=>e.st==='in'));
  $('#gl').classList.toggle('on',G.en.some(e=>e.kind==='v'&&e.st==='at'));
  const bi=$('#bI');if(bi){bi.disabled=(!!G.idUsed&&G.idT<=0)||!!G.out;bi.classList.toggle('on',G.idT>0);bi.textContent=G.idT>0?'🪪 ID ACTIVE '+G.idT+'s':G.idUsed?'🪪 ID USED':'🪪 ID CARD'}
  $('#items').innerHTML=(eco.own.pass?'🎟 Hall Pass: '+(G.passUsed?'used':'ready'):'')+(eco.own.id?'<br>🪪 ID Card: '+(G.idUsed?(G.idT>0?'active':'used'):'ready'):'');
  drawPhone();skipUI();
}
function tick(){
  if(G.over)return;G.el++;
  const free=G.idT>0,m=1+.1*(G.n-1),drain=free?0:((G.L?.6:0)+(G.V?.6:0)+(G.cam?.25:0))*m;if(G.idT>0)G.idT--;
  if(!G.out){G.power-=drain;if(G.power<=0){G.power=0;G.L=G.V=G.cam=G.light=0;G.out=1;G.outT=0}}
  else{G.outT++;if(G.outT>=7)return scare(G.en[0])}
  if(G.hide){G.o2-=100/60;if(G.o2<=0)return die('You ran out of oxygen...')}else G.o2=Math.min(100,G.o2+5);
  if(G.musicCd>0)G.musicCd--;if(G.snd>0)G.snd--;
  const inside=G.en.some(e=>e.st==='in');
  G.en.forEach(e=>{
    if(e.st==='in'){e.inT++;if(!G.hide&&e.inT>=1)scare(e);else if(e.inT>=10){e.st=0;e.node=0;e.inT=0}return}
    if(e.run!=null&&e.st===0){if(e.node===e.run)e.run=null;else{const D=bfs(e.run);e.node=ADJ[e.node].reduce((a,n)=>D[n]<D[a]?n:a)}return}
    if(!G.out&&G.el%4===0&&e.st===0&&Math.random()<e.a)bossStep(e);
    if(e.st==='at'&&!inside){e.at++;const lk=e.t==='door'?G.L:G.V;
      if(e.kind==='r'){if(e.at>=4){e.st='in';e.inT=0}}
      else if(G.hide){if(e.at>=3)scare(e)}
      else if(lk){if(e.at>=3){e.st=0;e.at=0;e.node=pick(ADJ[TGT[e.t]])}}
      else if(e.at>=5)scare(e)}
  });
  if(G.over)return;
  if(G.el>=G.hourLen*6){win();return}
  draw();
}
function scare(e){
  if(G.over)return;
  if(eco.own.pass&&!G.passUsed){G.passUsed=1;e.st=0;e.at=0;e.inT=0;e.run=null;e.node=e.start;if(G.out)G.outT=0;toast('🎟 GOLDEN HALL PASS USED — '+e.name+' was sent back');beep(500,.15,'triangle',.1);draw();return}
  G.over=1;G.scared=1;G.scareT=0;clearInterval(timer);ambStop();
  const g=e.model;CAM.add(g);g.visible=true;g.scale.setScalar(2.4);g.rotation.set(0,0,0);g.position.set(0,-3.6,-8);slip.visible=true;slip.scale.setScalar(1.5);yaw=0;pitch=0;G.up=0;G.sc=g;
  $('#phone').classList.remove('up');$('#stall').classList.remove('on');scream();
  setTimeout(()=>{CAM.remove(g);S.add(g);g.visible=false;slip.visible=false;slip.scale.setScalar(1);$('#scare').style.opacity=0;toMenu()},1500);
}
function die(msg){if(G.over)return;G.over=1;clearInterval(timer);ambStop();$('#dim').style.opacity=1;$('#msg').style.display='block';$('#msg').textContent=msg;setTimeout(toMenu,2300)}
function toMenu(){save=1;store(1);title()}
function win(skip){
  if(G.over)return;G.over=1;clearInterval(timer);ambStop();beep(660,.4,'triangle',.1);const nn=G.n;if(!skip)addCoins(50);
  if(nn<5){app.innerHTML=`<h1 class="go">6:00 AM</h1><p>Night ${nn} survived!${skip?'':' +50 coins 🪙'}</p>`;skipUI();setTimeout(()=>start(nn+1),1800);return}
  $('#wc').textContent=skip?'':'+50 coins 🪙 (total '+eco.coins+')';G.win=1;G.winT=0;G.cam=0;G.up=0;G.hide=0;yaw=0;pitch=0;['#phone','#stall'].forEach(s=>$(s).classList.remove('up','on'));['#msg','#o2w'].forEach(s=>$(s).style.display='none');skipUI();
}
title();
</script></body></html>
